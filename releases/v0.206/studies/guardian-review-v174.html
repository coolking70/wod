<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>守卫动作与邮铃检阅</title><link rel="stylesheet" href="../guardian-motion.css"><style>:root{color-scheme:dark;--line:#2a414c;--gold:#d5b77d}*{box-sizing:border-box}body{margin:0;background:#0b151b;color:#e0e8e6;font:15px/1.7 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1,h2{color:var(--gold)}button{font:inherit;color:inherit;background:#1b303a;border:1px solid #3a535c;border-radius:4px;padding:8px 12px;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure,section.panel{margin:18px 0;padding:18px;border:1px solid var(--line);background:#14242d;border-radius:6px}img.cutout{width:180px;height:198px;object-fit:contain;background:repeating-conic-gradient(#263c43 0 25%,#1a2d35 0 50%) 0/16px 16px}img.painted{object-fit:contain}.sheet{width:100%;height:auto}a{color:#75c2bd}small{color:#a2b7bb}.prop{width:24px;height:24px;vertical-align:middle;margin-right:8px}@media(max-width:700px){main{padding:16px}.grid{grid-template-columns:1fr}}</style><main><h1>守卫动作与邮铃 · 小范围检阅</h1><p>本页独立于正式存档。原生守卫模型沿实际出发装备和记录演示，绘制举盾试作仍供风格比较；配色接近不代表装备、侧向或动作覆盖已经匹配。</p><section id="review-source" class="panel"></section><section id="native-detail" class="panel"></section><div class="grid"><figure><img id="native-preview" class="cutout" width="180" height="198" src="../assets/studies/v174-guardian-native-poster.png" alt="当前原生守卫模型的静态起点，左侧持盾、右侧佩剑"><figcaption>同一原生SVG的八个实际动画位置，本地编码为900ms GIF。循环供观察；正式回放仍使用原生矢量和记录姿态，循环不追加行动或伤害。</figcaption><div class="bar"><button id="native-play">播放导出预览</button><button id="native-stop">显示静态起点</button></div><p id="native-status" role="status"></p><p><a href="../assets/studies/v174-guardian-native.gif" download>下载原生动作GIF</a> · < import{guardianDetailView,mountGuardianDetail}from'../expedition-guardian-detail.mjs';const data=await(await fetch('v174-guardian-review.json')).json();document.querySelector('#review-source').textContent='来源：第'+data.reportId+'次真实报告，'+data.hero.name+'，记录'+data.sourceEvents.map(e=>e.id).join('、')+'。挡架检定后仍受击19点；900ms只是本项目演出节奏，非战斗实测时间。';const target=document.querySelector('#native-detail'),reduced=matchMedia('(prefers-reduced-motion: reduce)');target.innerHTML=guardianDetailView(data.plan,{open:true,reduced:reduced.matches});const detail=mountGuardianDetail(target.querySelector('details'),data.plan,{reduced:reduced.matches}),preview=document.querySelector('#native-preview'),play=document.querySelector('#native-play'),status=document.querySelector('#native-status');function stop(){preview.src='../assets/studies/v174-guardian-native-poster.png';preview.dataset.playing='false';play.disabled=reduced.matches;status.textContent=reduced.matches?'已减少动态效果，显示静态起点。':'静态起点；可明确播放八帧导出预览。';}play.addEventListener('click',()=>{if(reduced.matches)return;preview.src='../assets/studies/v174-guardian-native.gif?preview='+Date.now();preview.dataset.playing='true';status.textContent='循环观察900ms导出动作；不改变原报告或追加伤害。';});document.querySelector('#native-stop').addEventListener('click',stop);reduced.addEventListener('change',e=>{detail.setReduced(e.matches);stop();});stop();
