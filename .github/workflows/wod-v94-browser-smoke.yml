name: WoD synthetic evidence transport
on:
  push:
    branches: [qa/wod-v94-chromium-20261125]
permissions:
  contents: read
jobs:
  producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      artifact-id: ${{ steps.publish.outputs.artifact-id }}
      zip-sha: ${{ steps.package.outputs.zip_sha }}
    steps:
      - name: Seal only the synthetic two-file fixture
        id: package
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/wod-evidence-canary"
          mkdir -p "$root"/{fixture/cases,fixture/control,publish}
          git init -q "$root/source"
          rev=b89b99553751ee4b764f1d8a191082b5ad77a50c
          git -C "$root/source" fetch --no-tags --depth=1 https://github.com/coolking70/wod.git "$rev"
          test "$(git -C "$root/source" rev-parse FETCH_HEAD)" = "$rev"
          git -C "$root/source" show "$rev:scripts/archive-evidence.py" >"$root/archive-evidence.py"
          printf '%s\n' '{"passed":true,"synthetic":true}' >"$root/fixture/control/receipt.json"
          printf '%s\n' 'Synthetic WoD evidence only' >"$root/fixture/cases/result.txt"
          zip="$root/publish/wod-synthetic-canary.zip"
          python3 "$root/archive-evidence.py" "$root/fixture" "$zip"
          sha="$(sha256sum "$zip" | cut -d ' ' -f 1)"
          printf 'zip_sha=%s\n' "$sha" >>"$GITHUB_OUTPUT"
      - name: Transfer the original ZIP as one opaque file
        id: publish
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          path: ${{ runner.temp }}/wod-evidence-canary/publish/wod-synthetic-canary.zip
          archive: false
          retention-days: 1
          if-no-files-found: error
  verifier:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download that single artifact on a fresh runner
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          artifact-ids: ${{ needs.producer.outputs.artifact-id }}
          path: ${{ runner.temp }}/received-wod-canary
          skip-decompress: true
          digest-mismatch: error
      - name: Verify exact ZIP bytes, CRC, membership and extracted bytes
        shell: bash
        env:
          PRODUCER_SHA: ${{ needs.producer.outputs.zip-sha }}
          ARTIFACT_ID: ${{ needs.producer.outputs.artifact-id }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          sha=lambda b: hashlib.sha256(b).hexdigest()
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          received=root/'received-wod-canary'
          p=received/'wod-synthetic-canary.zip'
          assert list(received.iterdir())==[p]
          assert sha(p.read_bytes())==os.environ['PRODUCER_SHA']
          expected={'cases/result.txt':b'Synthetic WoD evidence only\n',
                    'control/receipt.json':b'{"passed":true,"synthetic":true}\n'}
          prefix='fixture/'
          manifest=prefix+'.wod-evidence-manifest.json'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert sorted(z.namelist())==sorted([manifest]+[prefix+n for n in expected])
              m=json.loads(z.read(manifest))
              assert m['format']=='wod-complete-evidence' and m['version']==1
              assert len(m['files'])==2 and {r['path'] for r in m['files']}==set(expected)
              for r in m['files']:
                  n=r['path']; b=z.read(prefix+n)
                  assert b==expected[n] and len(b)==r['bytes'] and sha(b)==r['sha256']
                  restored=root/'wod-canary-restored'/n
                  restored.parent.mkdir(parents=True,exist_ok=True)
                  restored.write_bytes(b)
                  assert restored.read_bytes()==b
          print(json.dumps({'passed':True,'synthetic':True,'artifactId':os.environ['ARTIFACT_ID'],'zipSha256':sha(p.read_bytes()),'manifestMembers':2,'freshRunnerReadback':True}))
          PY
